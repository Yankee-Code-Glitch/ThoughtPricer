# --- MENU & GREETING ---
lang.select=Selecciona un idioma:
lang.options=\nEnglish(1)\nEspañol(2)
greeting.intro=¡Hola!\nEste es un programa que convierte el dinero a segundos de pensamiento, dependiendo de la comida. Verás a lo que me refiero.\nPresiona ENTER para continuar.
prompt.menu.choice=¿Quieres convertir monedas(1) o seguir con cálculos normales(2)?
error.invalid.choice.menu=Por favor, solo escoge un 1 o un 2.

# --- CURRENCY INPUTS ---
prompt.currency.source=¿Cuál es el código de la moneda desde la que quieres convertir?
prompt.currency.target=¿Cuál es el código de la moneda a la cual quieres hacer la conversión?
error.invalid.currency.length=El código de la moneda solo debe tener 3 caracteres de largo.

# --- FOOD MEASUREMENT INPUTS ---
prompt.food.measure=¿Tu comida está medida en kilos(1), libras(2), litros(3) u onzas fluidas(4)?
error.invalid.choice.measure=Por favor, solo da un número del 1 al 4.
prompt.weight.kilos=¿Cuántos kilos pesa?
prompt.weight.pounds=¿Cuántas libras pesa?
prompt.weight.liters=¿Cuántos litros contiene?
prompt.weight.ounces=¿Cuántas onzas fluidas contiene?
error.invalid.positive.number=Por favor, escoge un número positivo.
error.invalid.measure.range=Por favor, solo da un número del 1 al 4.

# --- CALORIES & COST INPUTS ---
prompt.calories.solid=¿Cuántas calorías tiene tu comida?
prompt.calories.liquid=¿Cuántas calories tiene tu bebida?
error.invalid.whole.number=Por favor, escoge un número entero.
prompt.cost=¿Cuánto te costó?

# --- EXCEPTION CHECKER FRAGMENTS ---
error.invalid.format=Por favor, escoge un %s e intenta otra vez.
text.integer=entero
text.decimal=decimal

# --- API MESSAGES ---
error.api.unsupported.currency=Esta moneda no es compatible.
error.api.unreachable=No se pudo acceder a la API de conversión de moneda. La conversión a %s no se realizará.\n

# --- THOUGHT PRICER RESULTS ---
result.seconds.full=¡Conseguirías ~%d segundos para pensar por cada %s %s esa comida!
result.minutes.full=¡Eso es equivalente a ~%d minutos y %d segundos!
text.generic.currency=moneda genérica
text.eating=comiendo
text.drinking=tomando

# --- FUN FACT ANALYSIS ---
result.physical.food.heavier=Dato curioso: Tu comida es más pesada que los centavos que tomaría comprarla.
result.physical.money.heavier=Dato curioso: El dinero en centavos que usaste para comprar tu comida es más pesado que la comida en sí.
result.physical.balance=¿¿¿Cómo...??? El peso en centavos de tu comida y el peso de la comida en sí son iguales... Perfectamente equilibrado, como todas las cosas deberían ser.