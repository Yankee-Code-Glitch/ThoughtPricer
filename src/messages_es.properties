# --- MENU & GREETING ---
lang.select=Selecciona un idioma:\nEnglish(1)\nEspañol(2)
greeting.intro="¡Hola!\nEste es un programa que convierte el dinero a segundos de pensamiento, dependiendo de la comida. Verás a lo que me refiero.\nPresiona ENTER para continuar."
