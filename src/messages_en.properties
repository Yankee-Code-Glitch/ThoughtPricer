# --- MENU & GREETING ---
lang.select=Select a language:
lang.options=\nEnglish(1)\nEspañol(2)
greeting.intro=Hello!\nThis is a program that converts money into seconds you can think given a food. You'll see what I mean.\nPress ENTER to continue.
prompt.menu.choice=Do you want to convert currencies(1) or stick with normal calculations(2)?
error.invalid.choice.menu=Please enter only a 1 or a 2.

# --- CURRENCY INPUTS ---
prompt.currency.source=What is the currency code for the currency you want to convert from?
prompt.currency.target=What is the currency code for the currency you want to convert to?
error.invalid.currency.length=The currency code should only be exactly 3 characters long.

# --- FOOD MEASUREMENT INPUTS ---
prompt.food.measure=Is your food measured in kilos(1), pounds(2), liters(3), or fluid ounces(4)?
error.invalid.choice.measure=Please only give a number 1-4.
prompt.weight.kilos=How many kilos does it weigh?
prompt.weight.pounds=How many pounds does it weigh?
prompt.weight.liters=How many liters does it contain?
prompt.weight.ounces=How many fluid ounces does it contain?
error.invalid.positive.number=Please enter a positive number.
error.invalid.measure.range=Please enter only a number between 1 and 4.

# --- CALORIES & COST INPUTS ---
prompt.calories=How many calories does your food item have?
error.invalid.whole.number=Please enter a positive whole number.
prompt.cost=How much did it cost?

# --- EXCEPTION CHECKER FRAGMENTS ---
error.invalid.format=Please enter a valid %s and try again.
text.integer=integer
text.decimal=decimal
# --- API MESSAGES ---
error.api.unsupported.currency=This currency is not supported.
error.api.unreachable=Could not reach currency API. The conversion to %s will not happen.\n

# --- THOUGHT PRICER RESULTS ---
result.seconds.full=You'd get ~%d seconds of thinking per %s by %s that!
result.minutes.full=That's equivalent to ~%d minutes and %d seconds!
text.generic.currency=generic currency
text.eating=eating
text.drinking=drinking
# --- FUN FACT ANALYSIS ---
result.physical.food.heavier=Fun fact: Your food is heavier than the pennies it'd take to buy it.
result.physical.money.heavier=Fun fact: The money you spent to buy your food in pennies is heavier than the food itself.
result.physical.balance=How...??? The weight in pennies of your food and the weight of your food itself is the same... Perfectly balanced, as all things should be.